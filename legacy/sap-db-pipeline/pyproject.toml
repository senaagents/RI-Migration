[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-db-pipeline"
version = "0.1.0"
description = "Standalone SAP Business One HANA extraction pipeline into a local staging database."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hdbcli>=2.23.24",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.36",
  "typer>=0.12.5",
]

[project.scripts]
sap-db-pipeline = "sap_db_pipeline.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
